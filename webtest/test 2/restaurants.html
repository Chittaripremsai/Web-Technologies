<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurants</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <nav class="restaurant-navbar">

    <div class="restaurant-logo">
        <img src="imges/Group.svg" alt="Swiggy">
    </div>

    <div class="restaurant-other">
        <span>Other</span>
        <span class="restaurant-arrow">⌄</span>
    </div>

    <div class="restaurant-nav-links">

        <div class="restaurant-nav-item">
            <span class="restaurant-icon">▣</span>
            <span>Swiggy Corporate</span>
        </div>

        <div class="restaurant-nav-item">
            <span class="restaurant-icon">⌕</span>
            <span>Search</span>
        </div>

        <div class="restaurant-nav-item">
            <span class="restaurant-icon">⚙</span>
            <span>Offers</span>
            <small>NEW</small>
        </div>

        <div class="restaurant-nav-item">
            <span class="restaurant-icon">◎</span>
            <span>Help</span>
        </div>

        <div class="restaurant-nav-item">
            <span class="restaurant-icon">♙</span>
            <span>Sign In</span>
        </div>

        <div class="restaurant-nav-item">
            <span class="restaurant-icon">▢</span>
            <span>Cart</span>
        </div>

    </div>
</nav>
    <div class="food-list">

        <div class="food-item">
            <img src="./imges/Biryani.avif" alt="Biryani">
            <p>Biryani</p>
        </div>

        <div class="food-item">
            <img src="./imges/South Indian.avif" alt="South Indian">
            <p>South Indian</p>
        </div>

        <div class="food-item">
            <img src="./imges/North Indian.avif" alt="North Indian">
            <p>North Indian</p>
        </div>

        <div class="food-item">
            <img src="imges/Desserts.avif" alt="Desserts">
            <p>Desserts</p>
        </div>

        <div class="food-item">
            <img src="imges/Pizza.avif" alt="Pizza">
            <p>Pizza</p>
        </div>

        <div class="food-item">
            <img src="imges/Ice Cream.avif" alt="Ice Cream">
            <p>Ice Cream</p>
        </div>

        <div class="food-item">
            <img src="imges/Coffee.avif" alt="Coffee">
            <p>Coffee</p>
        </div>

    </div>

    </div>
</body>
</html>
