<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" rules="all" width="500" height="200">
        <tr>
            <th>S.no</th>
            <th>inputfield</th>
            <th>namefield</th>
        </tr>
        <tr align="center">
            <td>1.</td>
            <td>text</td>
            <td><input type="text" name="Username" placeholder="Enter the Username"></td>
        </tr>
        <tr align="center">
            <td>2.</td>
            <td>email</td>
            <td><input type="email" name="mail" placeholder="Enter The E-mail id"></td>
        </tr>
        <tr align="center">
            <td>3.</td>
            <td>password</td>
            <td><input type="password" name="password" placeholder="Enter the password"></td>
        </tr>
        <tr align="center">
            <td>4.</td>
            <td>tel</td>
            <td><input type="tel" name="Contact" placeholder="Enter The Contact Number" pattern="[6-9](1)[0-9](9)"></td>
        </tr>
        <tr align="center">
            <td>5.</td>
            <td>Age</td>
            <td><input type="Age" name="Age" placeholder="Enter the Age"></td>
        </tr>
        <tr align="center">
            <td>6.</td>
            <td>Date</td>
            <td><input type="date" name="dob"></td>
        </tr>
        <tr align="center">
            <td>7.</td>
            <td>Time</td>
            <td><input type="time" name="time"></td>
        </tr>
        <tr align="center">
        <td>8.</td>
        <td>Date-Time Local</td>
        <td><input type="datetime-local" name="date-time"></td>
    </tr>
    <tr align="center">
        <td>9.</td>
        <td>month</td>
        <td><input type="month" name="maonth"></td>
    </tr>
    <tr align="center">
        <td>10.</td>
        <td>week</td>
        <td><input type="week" name="week"></td>
    </tr>
    <tr align="center">
        <td>11.</td>
        <td>radio</td>                 
        <td> <label>M</label><input type="radio" name="gender"> <label>F</label><input type="radio" name="gender"> <label>O</label><input type="radio" name="gender"></td>
    </tr>
    <tr align="center">
        <td>12.</td>
        <td>checkbox</td>
        <td> <label>Telugu</label><input type="checkbox" name="lang" value="Telugu"> <label> English</label> <input type="checkbox" name="lang" value="English"></td>
    </tr>
    </table>
</body>
</html>
