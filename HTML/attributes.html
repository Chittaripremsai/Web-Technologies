<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo on Attributes</title>
    <h1 style="color: darkblue;">Welcome the Class</h1> <!--attribute is adding additional features-->
    
    <!-- Attributes : it is property of HTMl element & it is used to give extra or additional info of HTML elements-->

</head>
<body>
    <h2 style="color: blueviolet;">This is prem</h2>  <!-- style attribute : is used to give design for html element-->
    
    <h3 title="cascading spread sheet">CSS</h3> <!--title attribute : it is used to add title name for HTML element-->
    
    <h3 title="Hyper text markup language">HTML</h3>
    <h2><abbr title="Java Script">JS</abbr></h2>
    <hr>
    <marquee >HELLO</marquee>
    <marquee direction="right">HTML</marquee>
    <marquee direction="right">CSS</marquee>
    <marquee direction="down" bgcolor="cyan" height="120" width="100">Java Script</marquee>
    <hr>
    <marquee scrollamount="100" direction="right" style="color:red">Web Technology Yarr!!</marquee>
    <marquee  behavior="alternate" scrollamount="30" direction="left" style="color:peru">👽Here We Goooo!!</marquee>
    <marquee  behavior="slide" scrollamount="30" direction="left" style="color:gold">👽Here We Goooo!!</marquee>
    

    <marquee behavior="alternate" direction="down" bgcolor="yellow" scrollamount="20" height="120" >❤️ </marquee><br>
    <marquee direction="down" bgcolor="cyan" scrollamount="20" height="120" width="200">🎈 🎈 🎈 🎈 🎈 🎈 🎈  </marquee>
    <marquee    bgcolor="blue"  ><marquee height="75" direction="up" scrollamount="15"  behavior="alternate" >⚽</marquee></marquee>

</body>
</html>
