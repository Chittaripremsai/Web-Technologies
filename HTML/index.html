<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="flag">
       <div id="circle"></div> 
    </div>
    <form onsubmit="displaycolor(event)">
        <input type="color" id="color">
        <input type="submit">
    </form>

    <script>
        let displaycolor = (e) => {
            e.preventDefault()
            document.body.style.background = document.getElementById('color').
            value
        }
    </script>


    
</body>
</html>
